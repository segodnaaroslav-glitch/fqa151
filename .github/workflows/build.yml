name: Build MM2Pricer.exe

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python tests/test_units.py
      - name: End-to-end tests (mock site, real Chrome)
        env:
          MM2_E2E_LOGS: e2e-logs
        run: python tests/run_e2e.py
      - name: Show e2e logs
        if: failure()
        shell: bash
        run: for f in e2e-logs/*/log.txt; do echo "===== $f"; cut -c1-400 "$f"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build exe
        run: python -m PyInstaller --onefile --console --name MM2Pricer mm2_pricer.py
      - name: Smoke test
        run: .\dist\MM2Pricer.exe --help
      - name: Checksum
        shell: bash
        run: sha256sum dist/MM2Pricer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MM2Pricer
          path: dist/MM2Pricer.exe
      # один файл MM2Pricer.exe для скачивания по прямой ссылке
      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=mm2pricer-latest
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/MM2Pricer.exe --target "$GITHUB_SHA" \
            --title "MM2 Pricer v2" \
            --notes "Скачайте MM2Pricer.exe и запустите. Тестовый запуск без изменения цен: MM2Pricer.exe --dry-run. Сборка из ${GITHUB_SHA::7}."

  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (StarPets Helper)
        run: node --test tests/starpets/core.test.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end tests (extension in Chromium, mock site)
        run: xvfb-run -a node tests/starpets/e2e.js
      - name: Pack extension
        run: cd starpets_extension && zip -r ../StarPetsHelper.zip . -x README.md
      - uses: actions/upload-artifact@v4
        with:
          name: StarPetsHelper
          path: StarPetsHelper.zip
      # StarPetsHelper.zip для скачивания по прямой ссылке
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=starpets-helper-latest
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" StarPetsHelper.zip --target "$GITHUB_SHA" \
            --title "StarPets Helper" \
            --notes "Расширение для starpets.gg. Распакуйте StarPetsHelper.zip, откройте chrome://extensions, включите «Режим разработчика» и нажмите «Загрузить распакованное расширение». Сборка из ${GITHUB_SHA::7}."
